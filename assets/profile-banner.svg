<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Max Yang — Cloud Infrastructure and AI</title>
  <desc id="desc">A dark navy and cyan banner for Max Yang, Cloud Infrastructure Engineer and AI Enthusiast.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121d"/>
      <stop offset="0.55" stop-color="#0a1b29"/>
      <stop offset="1" stop-color="#102b3a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#12b9e8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#12b9e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94cde2" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <circle cx="940" cy="112" r="230" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="1080" cy="320" r="170" fill="url(#glow)" opacity=".55"/>

  <g fill="none" stroke="#43c7eb" stroke-opacity=".24" stroke-width="1.5">
    <path d="M730 0v68h76v44h76"/>
    <path d="M840 380v-78h82v-48h84"/>
    <path d="M1200 128h-74v54h-66"/>
    <path d="M1040 0v48h-54v44"/>
  </g>
  <g fill="#5ee1ff" opacity=".76">
    <circle cx="882" cy="112" r="3"/>
    <circle cx="1006" cy="254" r="3"/>
    <circle cx="1126" cy="182" r="3"/>
    <circle cx="986" cy="92" r="3"/>
  </g>

  <rect x="74" y="58" width="58" height="38" rx="19" fill="#0c2635" stroke="#25bde8" stroke-opacity=".55"/>
  <text x="103" y="83" fill="#69dcff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" text-anchor="middle">MY</text>

  <text x="74" y="143" fill="#55d7f7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">CLOUD INFRASTRUCTURE · AI AGENTS</text>
  <text x="70" y="220" fill="#f1f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">Max Yang</text>
  <text x="75" y="264" fill="#b6c6d1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Cloud Infrastructure Engineer · AI Enthusiast</text>
  <text x="75" y="318" fill="#76a9bb" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">PANDACOOMING  /  GITHUB</text>

  <rect x="75" y="340" width="94" height="3" rx="1.5" fill="#28c3e8"/>
  <rect x="177" y="340" width="28" height="3" rx="1.5" fill="#28c3e8" opacity=".42"/>
</svg>