<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Max Yang — Cloud infrastructure. Agent possibilities.</title>
  <desc id="description">An editorial charcoal banner with warm ivory typography and a sculptural network of orbital paths in sage green. Cloud Infrastructure Engineer and AI Enthusiast.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D2422"/>
      <stop offset="1" stop-color="#101715"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(953 218) rotate(90) scale(229 256)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7CFA2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#B7CFA2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="788" y1="74" x2="1108" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1E3BC"/>
      <stop offset=".5" stop-color="#839C78"/>
      <stop offset="1" stop-color="#D1E3BC" stop-opacity=".25"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#background)"/>
    <rect width="1200" height="440" fill="url(#halo)"/>
    <path d="M728 0V440" stroke="#E8EDDF" stroke-opacity=".08"/>
    <path d="M0 364H1200" stroke="#E8EDDF" stroke-opacity=".13"/>
    <g font-family="'Courier New', monospace" font-size="12" letter-spacing="2">
      <text x="56" y="49" fill="#B9C8AE">MAX YANG / PANDACOOMING</text>
      <text x="1144" y="49" fill="#93A096" text-anchor="end">CLOUD + AI</text>
    </g>
    <text x="52" y="167" fill="#F2F0E8" font-family="Georgia, 'Times New Roman', serif" font-size="88" letter-spacing="-4">Max Yang<tspan fill="#C0D4A8">.</tspan></text>
    <text x="57" y="222" fill="#D4DAD0" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="-.4">Cloud infrastructure. Agent possibilities.</text>
    <text x="57" y="269" fill="#98A59C" font-family="Arial, Helvetica, sans-serif" font-size="16">Exploring the systems behind reliable services</text>
    <text x="57" y="294" fill="#98A59C" font-family="Arial, Helvetica, sans-serif" font-size="16">and the next generation of AI agents.</text>
    <!-- Orbital geometry: infrastructure as an interconnected system. -->
    <g transform="translate(960 207)">
      <circle r="143" stroke="#BFD2AD" stroke-opacity=".12"/>
      <circle r="106" stroke="#BFD2AD" stroke-opacity=".08" stroke-dasharray="2 8"/>
      <path d="M-165 0H165M0-165V165" stroke="#BFD2AD" stroke-opacity=".1"/>
      <g stroke="url(#orbit)" stroke-width="1.3">
        <ellipse rx="163" ry="62" transform="rotate(-38)"/>
        <ellipse rx="163" ry="62" transform="rotate(22)"/>
        <ellipse rx="163" ry="62" transform="rotate(82)"/>
      </g>
      <circle r="24" fill="#C0D4A8" fill-opacity=".06" stroke="#C0D4A8" stroke-opacity=".25"/>
      <path d="M-7 0H7M0-7V7" stroke="#D8E6C8" stroke-width="1.5"/>
      <circle cx="129" cy="-89" r="5" fill="#D5E5C2"/>
      <circle cx="-128" cy="-76" r="4" fill="#A8BF94"/>
      <circle cx="-23" cy="156" r="4" fill="#A8BF94"/>
      <circle cx="129" cy="-89" r="11" stroke="#D5E5C2" stroke-opacity=".2"/>
    </g>
    <g font-family="'Courier New', monospace" font-size="11" letter-spacing="1.4">
      <text x="57" y="407" fill="#A9B5A9">CLOUD INFRASTRUCTURE ENGINEER</text>
      <text x="474" y="407" fill="#A9B5A9">AI ENTHUSIAST</text>
      <text x="1144" y="407" fill="#C0D4A8" text-anchor="end">CURIOUS BY DEFAULT ↗</text>
    </g>
  </g>
</svg>
